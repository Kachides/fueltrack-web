<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FuelTrack">
<title>Fuel Tracker Pro — Учёт топлива</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="container header-inner">
      <div class="logo"><div class="logo-icon">⛽</div><span>FuelTrack Pro</span></div>
      <div class="header-actions">
        <button class="icon-btn" id="voiceBtn" title="Голосовой ввод">🎤</button>
        <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
        <button class="icon-btn" id="exportBtn" title="Экспорт">📤</button>
      </div>
    </div>
  </header>
  <nav class="nav" id="nav">
    <button class="nav-btn active" data-tab="dashboard">📊 Панель</button>
    <button class="nav-btn" data-tab="fuel">⛽ Заправки</button>
    <button class="nav-btn" data-tab="stats">📈 Статистика</button>
    <button class="nav-btn" data-tab="reminders">🔔 Напоминания</button>
    <button class="nav-btn" data-tab="shifts">🧮 Смены</button>
    <button class="nav-btn" data-tab="settings">⚙️ Настройки</button>
  </nav>
  <main class="main">
    <div class="container">
      <section class="tab active" id="tab-dashboard"></section>
      <section class="tab" id="tab-fuel"></section>
      <section class="tab" id="tab-stats"></section>
      <section class="tab" id="tab-reminders"></section>
      <section class="tab" id="tab-shifts"></section>
      <section class="tab" id="tab-settings"></section>
    </div>
  </main>
  <button class="fab" id="fab" title="Добавить">+</button>
  <div class="toast-container" id="toastContainer"></div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<script src="app.js"></script>
</body>
</html>
